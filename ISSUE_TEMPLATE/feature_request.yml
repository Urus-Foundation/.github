name: 💡 Feature Request
description: Suggest a new feature or improvement for Urus
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion! Please provide as much detail as possible so we can evaluate and prioritize your request.

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of Urus does this relate to?
      options:
        - Language Syntax
        - Type System
        - Compiler
        - Standard Library
        - CLI / Tooling
        - Documentation
        - Editor Support
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. Include code examples if applicable.
      placeholder: |
        I'd like to be able to write:
        ```urus
        // your proposed syntax here
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Change?
      description: Would this require changes to existing code?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, references, or examples from other languages.
    validations:
      required: false
